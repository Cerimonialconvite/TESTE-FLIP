<style>
  :root{ --papel:#dce7f0; --marinho:#0c4c7b; --claro:#e9f1f8; --prata:#c9d9e8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--papel);height:100%}
  body{font-family:"Cinzel",Georgia,serif;color:var(--marinho);-webkit-tap-highlight-color:transparent}
  .tela{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f1ea;z-index:10;transition:opacity .6s ease}
  .tela.oculta{opacity:0;pointer-events:none}
  .quadro{position:relative;height:100%;width:100%;max-width:calc(100vh * 9 / 16);max-height:calc(100vw * 16 / 9);overflow:hidden}
  .quadro img,.quadro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .fundo{position:absolute;inset:-60px;background:url(img/capa.jpg) center/cover;filter:blur(28px) saturate(.9);opacity:.9}
  #capa{cursor:pointer}
  #capa .pulso{position:absolute;left:49%;top:53.2%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;animation:pulso 2.2s ease-in-out infinite}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 30px 10px rgba(255,255,255,.55)}}
  #pular{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:8px 14px;border:1px solid rgba(12,76,123,.4);border-radius:30px;background:rgba(244,241,234,.75);color:var(--marinho);font:500 13px "Cinzel",serif;letter-spacing:.08em;opacity:0;transition:opacity .6s;z-index:2}
  #animacao.mostra-pular #pular{opacity:1}
  /* clarão: nasce da luz do envelope e cobre a tela */
  #raio{position:absolute;left:48%;top:46%;width:60%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.15);border-radius:50%;
        background:radial-gradient(circle,#fff 0%,#fff 35%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 70%);opacity:0;pointer-events:none;
        transition:transform 1.9s cubic-bezier(.5,0,.75,.4),opacity .5s ease}
  #animacao.clareando #raio{opacity:1;transform:translate(-50%,-50%) scale(7)}
  #brilho{position:fixed;inset:0;background:radial-gradient(circle at 50% 46%,#fff 0%,#fff 55%,#f6f9fc 100%);opacity:0;pointer-events:none;z-index:20;transition:opacity 1s ease}
  #brilho.saindo{transition:opacity 1.6s ease}

  #convite{position:relative;max-width:540px;margin:0 auto;background:var(--papel);opacity:0;transition:opacity .6s ease;overflow:hidden}
  #convite.visivel{opacity:1}
  .faixa{position:relative;width:100%;container-type:inline-size}
  .faixa>canvas{display:block;width:100%;height:auto}
  .ponto{position:absolute;width:15.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;display:block;z-index:3;opacity:0;transition:opacity .4s}
  .ponto.ativo{opacity:1}
  .ponto:focus-visible{outline:2px solid var(--marinho);outline-offset:4px}
  .ponto::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulsoIcone 2.4s ease-in-out infinite}
  @keyframes pulsoIcone{0%,100%{box-shadow:0 0 0 0 rgba(12,76,123,.35)}60%{box-shadow:0 0 0 14px rgba(12,76,123,0)}}

  /* brilho prateado que passa sobre o desenho (monograma, 15) */
  .reflexo{position:absolute;pointer-events:none;opacity:0;transition:opacity .6s;
    background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;background-repeat:no-repeat;
    -webkit-mask-size:100% 100%;mask-size:100% 100%;}
  .reflexo.ligado{opacity:1;animation:reflexo 6s ease-in-out infinite}
  @keyframes reflexo{0%{background-position:100% 0}28%,100%{background-position:0% 0}}

  /* contagem na faixa azul */
  .contagem{position:absolute;left:0;right:0;top:15%;height:73.5%;color:var(--claro);text-align:center}
  .estrelas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 1.6s}
  .contagem.revelada .estrelas{opacity:1}
  .cont-txt{position:relative;padding-top:6cqw}
  .contagem h2{font-family:"Pinyon Script",cursive;font-weight:400;font-size:12cqw;line-height:1.05;color:#f2f7fb;text-shadow:0 0 18px rgba(201,217,232,.35)}
  .contagem p{margin-top:.8cqw;font-size:3.1cqw;letter-spacing:.22em;color:var(--prata)}
  .relogio{display:flex;justify-content:center;gap:2.4cqw;margin-top:5cqw}
  .unidade{width:17cqw;padding:2.6cqw 0 2cqw;border-top:1px solid rgba(201,217,232,.55);border-bottom:1px solid rgba(201,217,232,.55)}
  .unidade b{display:block;font-weight:500;font-size:8.6cqw;line-height:1;color:#fff;font-variant-numeric:lining-nums tabular-nums}
  .unidade small{display:block;margin-top:1.6cqw;font-size:2.4cqw;letter-spacing:.2em;color:var(--prata)}
  .contagem h2,.contagem p,.unidade,.chegou{opacity:0;transform:translateY(5cqw);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
  .contagem.revelada h2,.contagem.revelada p,.contagem.revelada .unidade,.contagem.revelada .chegou{opacity:1;transform:none}
  .contagem.revelada p{transition-delay:.35s}
  .contagem.revelada .unidade:nth-child(1){transition-delay:.7s}
  .contagem.revelada .unidade:nth-child(2){transition-delay:.9s}
  .contagem.revelada .unidade:nth-child(3){transition-delay:1.1s}
  .contagem.revelada .unidade:nth-child(4){transition-delay:1.3s}
  .chegou{display:none;margin-top:5cqw;font-family:"Pinyon Script",cursive;font-size:10cqw;color:#fff}
  .buque{position:absolute;right:-6%;bottom:-17%;width:46%;opacity:0;transform:translateX(40%) rotate(8deg);transition:opacity 1.4s ease,transform 1.8s cubic-bezier(.2,.7,.2,1);pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,20,45,.35))}
  .contagem.revelada .buque{opacity:1;transform:none;transition-delay:1.4s}

  #petalas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  .aviso{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(12,76,123,.92);color:#fff;font:400 13px "Cinzel",serif;letter-spacing:.06em;padding:10px 16px;border-radius:24px;opacity:0;transition:opacity .4s,transform .4s;z-index:40;pointer-events:none;white-space:nowrap}
  .aviso.mostra{opacity:1;transform:translate(-50%,0)}

  #som{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border-radius:50%;border:1px solid rgba(12,76,123,.35);background:rgba(233,241,248,.9);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(12,40,70,.18)}
  #som.ativo{display:flex}
  #som svg{width:22px;height:22px;fill:none;stroke:var(--marinho);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #som .off{display:none} #som.mudo .on{display:none} #som.mudo .off{display:block}

  #convite{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#e3ecf3 0%,#c3d3e1 100%);opacity:0;transition:opacity .6s ease;overflow:hidden;max-width:none}
  #convite.visivel{opacity:1}
  #palco{width:min(100vw,calc(100vh * 9 / 16));height:min(100vh,calc(100vw * 16 / 9));position:relative}
  #palco{overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  .folha{position:absolute;inset:0}
  .pagina{position:absolute;inset:0;background:#dbe6ee;container-type:inline-size;overflow:hidden}
  .pagina>img.pg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
  .sombra{position:absolute;left:0;top:0;pointer-events:none;display:none}
  .verso{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;display:none;filter:drop-shadow(0 0 10px rgba(10,30,50,.25))}
  .verso-in{background-color:#eef3f7}
  .pagina .ponto{opacity:1}
  .contagem{top:31.15%;height:39.79%}
  .buque{bottom:-14%}
  .dica{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:30px;background:rgba(12,76,123,.85);color:#fff;font:400 13px "Cinzel",serif;letter-spacing:.08em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
  .dica.mostra{opacity:1}
  .dica svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:arrasta 1.6s ease-in-out infinite}
  @keyframes arrasta{0%,100%{transform:translateX(8px)}50%{transform:translateX(-8px)}}
  .pontos{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:flex;gap:9px;opacity:0;transition:opacity .6s}
  #convite.visivel~.pontos,.pontos.mostra{opacity:1}
  .pontos i{width:8px;height:8px;border-radius:50%;background:rgba(12,76,123,.25);transition:background .3s,transform .3s}
  .pontos i.ativo{background:#0c4c7b;transform:scale(1.25)}
  .seta{position:fixed;top:50%;z-index:8;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:1px solid rgba(12,76,123,.3);background:rgba(233,241,248,.8);display:none;align-items:center;justify-content:center;cursor:pointer}
  .seta svg{width:18px;height:18px;fill:none;stroke:#0c4c7b;stroke-width:1.8}
  @media (min-width:700px){ .seta{display:flex} }
  #ant{left:calc(50% - min(50vw, calc(50vh * 9 / 16)) - 56px)} #prox{right:calc(50% - min(50vw, calc(50vh * 9 / 16)) - 56px)}

</style>

 </div>

<script>

(function(){
  /* ===== AJUSTES ===== */
  var LINK_CONFIRMACAO = 'https://docs.google.com/spreadsheets/d/1fOBe2WbZoHELlW6BDOIMcx_IAgHSP_4gQLHrIctB1ow/edit?usp=sharing';                       // cole aqui o link de confirmação de presença
  var DATA_EVENTO = '2027-01-30T21:00:00-03:00';   // 30/01/2027 às 21h

  var capa=document.getElementById('capa'), anim=document.getElementById('animacao'),
      video=document.getElementById('video'), brilho=document.getElementById('brilho'),
      convite=document.getElementById('convite'), musica=document.getElementById('musica'),
      som=document.getElementById('som'), aberto=false, terminou=false, clareou=false;
  var semMovimento=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{ video.load(); }catch(e){}

  /* ---------- confirmação ---------- */
  var rsvp=document.getElementById('p-rsvp'), aviso=document.getElementById('aviso');
  if(LINK_CONFIRMACAO){ rsvp.href=LINK_CONFIRMACAO; }
  else rsvp.addEventListener('click',function(e){ e.preventDefault(); aviso.classList.add('mostra'); setTimeout(function(){ aviso.classList.remove('mostra'); },2600); });

  /* ---------- música ---------- */
  function fadeIn(){ musica.volume=0; var v=0; var t=setInterval(function(){ v+=0.05; musica.volume=Math.min(v,0.85); if(v>=0.85) clearInterval(t); },150); }
  function tocar(){
    var p=musica.play();
    if(p&&p.then) p.then(function(){ som.classList.add('ativo'); fadeIn(); }).catch(function(){ som.classList.add('ativo','mudo'); });
    else som.classList.add('ativo');
  }
  var pausadoPeloUsuario=false, saiuPorLink=false;
  som.addEventListener('click',function(){
    if(musica.paused){ pausadoPeloUsuario=false; musica.play(); som.classList.remove('mudo'); som.setAttribute('aria-label','Pausar música'); }
    else { pausadoPeloUsuario=true; musica.pause(); som.classList.add('mudo'); som.setAttribute('aria-label','Tocar música'); }
  });
  /* mapa e confirmação: a música continua tocando; se o celular pausar, volta sozinha ao retornar */
  document.querySelectorAll('.ponto').forEach(function(p){ p.addEventListener('click',function(){ if(p.getAttribute('href')!=='#') saiuPorLink=true; }); });
  function retomar(){
    if(!aberto||pausadoPeloUsuario||!musica.paused) return;
    var p=musica.play();
    if(p&&p.catch) p.catch(function(){
      var umToque=function(){ document.removeEventListener('pointerdown',umToque,true); if(!pausadoPeloUsuario) musica.play(); };
      document.addEventListener('pointerdown',umToque,true);
    });
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ if(!saiuPorLink && !musica.paused) musica.pause(); }
    else { saiuPorLink=false; retomar(); }
  });
  window.addEventListener('pageshow',retomar);
  window.addEventListener('focus',function(){ saiuPorLink=false; retomar(); });

  /* ---------- abertura: envelope + clarão ---------- */
  function clarear(){
    if(clareou) return; clareou=true;
    anim.classList.add('clareando');
    setTimeout(function(){ brilho.style.opacity='1'; },900);
  }
  function abrir(){
    if(aberto) return; aberto=true;
    tocar();
    anim.classList.remove('oculta'); capa.classList.add('oculta');
    var p=video.play(); if(p&&p.catch) p.catch(function(){ mostrarConvite(); });
    setTimeout(function(){ anim.classList.add('mostra-pular'); },1500);
    setTimeout(mostrarConvite,9000);
  }
  video.addEventListener('timeupdate',function(){ if(video.duration && video.currentTime>=video.duration-1.75) clarear(); });
  function mostrarConvite(){
    if(terminou) return; terminou=true;
    clarear(); brilho.style.opacity='1';
    setTimeout(function(){
      convite.hidden=false;
      anim.classList.add('oculta'); try{ video.pause(); }catch(e){}
      convite.classList.add('visivel');
      setTimeout(function(){ brilho.classList.add('saindo'); brilho.style.opacity='0'; iniciarLivro(); iniciarPetalas(); },350);
      setTimeout(function(){ capa.remove(); anim.remove(); },2200);
    },900);
  }
  capa.addEventListener('click',abrir);
  capa.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrir(); } });
  video.addEventListener('ended',mostrarConvite);
  document.getElementById('pular').addEventListener('click',mostrarConvite);

  /* ---------- livro: língua no canto, puxar na diagonal ---------- */
  var palco=document.getElementById('palco'), folhas=[], atual=0, W=0, H=0, arrasto=null, animando=false;
  function v(x,y){ return {x:x,y:y}; }
  function reflete(p,m,d){ var px=p.x-m.x, py=p.y-m.y, k=px*d.x+py*d.y; return v(m.x+2*k*d.x-px, m.y+2*k*d.y-py); }
  // fold definido pelo ponto P (onde está o canto inferior direito C)
  function geometria(P){
    var C=v(W,H), dx=C.x-P.x, dy=C.y-P.y, L=Math.hypot(dx,dy);
    if(L<0.5) return null;
    var n=v(dx/L,dy/L), M=v((C.x+P.x)/2,(C.y+P.y)/2);
    return {n:n,M:M,d:v(-n.y,n.x),dist:L/2};
  }
  function corta(poly,g,ladoC){ // Sutherland-Hodgman com semiplano
    var out=[], f=function(p){ var s=(p.x-g.M.x)*g.n.x+(p.y-g.M.y)*g.n.y; return ladoC?s:-s; };
    for(var i=0;i<poly.length;i++){
      var a=poly[i], b=poly[(i+1)%poly.length], fa=f(a), fb=f(b);
      if(fa>=0) out.push(a);
      if((fa>=0)!==(fb>=0)){ var t=fa/(fa-fb); out.push(v(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t)); }
    }
    return out;
  }
  function poligono(p){ return p.length<3?'polygon(0 0,0 0,0 0)':'polygon('+p.map(function(q){ return q.x.toFixed(1)+'px '+q.y.toFixed(1)+'px'; }).join(',')+')'; }
  function gradiente(g,stops){ // gradiente ao longo de n, posições em px a partir da linha da dobra
    var ang=Math.atan2(g.n.x,-g.n.y)*180/Math.PI, Lg=Math.abs(W*g.n.x)+Math.abs(H*g.n.y);
    var s0=(g.M.x-W/2)*g.n.x+(g.M.y-H/2)*g.n.y+Lg/2;
    return 'linear-gradient('+ang.toFixed(2)+'deg,'+stops.map(function(s){ return s[0]+' '+(s0+s[1]).toFixed(1)+'px'; }).join(',')+')';
  }
  function linhaPorDoisPontos(A,B){ // devolve P = reflexo de C pela reta AB
    var L=Math.hypot(B.x-A.x,B.y-A.y), d=v((B.x-A.x)/L,(B.y-A.y)/L);
    return reflete(v(W,H),A,d);
  }
  function restoDireita(j,k){ return linhaPorDoisPontos(v(W-j,H),v(W,H-k)); }
  function restoEsquerda(j,k){ return linhaPorDoisPontos(v(0,H-k),v(j,H)); }
  var VIRADA=function(){ return v(-W,H); };

  function desenha(f){
    var P=f.P, el=f.el, g=geometria(P), ret=[v(0,0),v(W,0),v(W,H),v(0,H)];
    if(!g){ f.frente.style.clipPath='none'; f.verso.style.display='none'; f.sombra.style.display='none'; el.style.visibility='visible'; return; }
    var frente=corta(ret,g,false);
    if(frente.length<3 && P.x<=-W+1){ el.style.visibility='hidden'; return; }
    el.style.visibility='visible';
    f.frente.style.clipPath=f.frente.style.webkitClipPath=poligono(frente);
    var dobra=corta(ret,g,true);
    // verso: região dobrada refletida pela linha
    var d=g.d, a=d.x*d.x-d.y*d.y, b=2*d.x*d.y, c=b, dd=d.y*d.y-d.x*d.x;
    var e=g.M.x-(a*g.M.x+c*g.M.y), ff=g.M.y-(b*g.M.x+dd*g.M.y);
    f.verso.style.display='block';
    f.verso.style.transform='matrix('+a+','+b+','+c+','+dd+','+e+','+ff+')';
    f.versoIn.style.clipPath=f.versoIn.style.webkitClipPath=poligono(dobra);
    f.versoIn.style.backgroundImage=gradiente(g,[['rgba(20,40,60,.22)',0],['rgba(255,255,255,0)',Math.min(70,g.dist*.5)],['rgba(255,255,255,.35)',g.dist*1.2]]);
    // sombra sobre a página de baixo
    f.sombra.style.display='block';
    f.sombra.style.clipPath=f.sombra.style.webkitClipPath=poligono(dobra);
    f.sombra.style.backgroundImage=gradiente(g,[['rgba(10,30,50,.38)',0],['rgba(10,30,50,0)',Math.min(110,g.dist*.9)]]);
  }
  function ordem(){
    folhas.forEach(function(f,i){ f.el.style.zIndex = i<atual ? 100+i : 50-i; });
  }
  // ---------- estados de repouso + língua mexendo ----------
  var t0=performance.now();
  function lingua(t,ladoEsq){
    var ciclo=((t-t0)/1000+(ladoEsq?1.3:0))%3.2, amp=0;
    if(ciclo<1.1) amp=Math.sin(ciclo/1.1*Math.PI);
    var j=W*(0.12+0.06*amp), k=W*(0.15+0.07*amp);
    return ladoEsq? restoEsquerda(j*0.9,k*0.9) : restoDireita(j,k);
  }
  function quadro(t){
    if(!arrasto && !animando){
      var cur=folhas[atual], ant=folhas[atual-1];
      if(cur && atual<folhas.length-1){ cur.P=lingua(t,false); desenha(cur); }
      if(ant){ ant.P=lingua(t,true); desenha(ant); }
    }
    requestAnimationFrame(quadro);
  }
  // ---------- animação até um alvo ----------
  function animar(f,alvo,dur,arco,fim){
    animando=true; var de=v(f.P.x,f.P.y), ini=performance.now();
    (function passo(t){
      var p=Math.min(1,(t-ini)/dur), e=1-Math.pow(1-p,3);
      f.P=v(de.x+(alvo.x-de.x)*e, de.y+(alvo.y-de.y)*e - Math.sin(Math.PI*e)*arco);
      desenha(f);
      if(p<1) requestAnimationFrame(passo); else { animando=false; if(fim) fim(); }
    })(ini);
  }
  function irPara(n){
    atual=n; ordem();
    folhas.forEach(function(f,i){ if(i<atual-1){ f.P=VIRADA(); desenha(f); } else if(i>atual){ f.P=v(W,H); desenha(f); } });
    document.querySelectorAll('#pontos i').forEach(function(p,k){ p.classList.toggle('ativo',k===atual); });
    if(atual===2) revelarContagem();
  }
  function proxima(){ if(animando||atual>=folhas.length-1) return; var f=folhas[atual]; animar(f,VIRADA(),850,H*0.18,function(){ irPara(atual+1); }); }
  function anterior(){ if(animando||atual<=0) return; var f=folhas[atual-1]; animar(f,v(W,H),850,H*0.18,function(){ irPara(atual-1); }); }
  // ---------- arrastar ----------
  function local(e){ var r=palco.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return v(t.clientX-r.left,t.clientY-r.top); }
  function limita(P){
    var hb=v(0,H), dx=P.x-hb.x, dy=P.y-hb.y, r=Math.hypot(dx,dy);
    if(r>W){ P=v(hb.x+dx/r*W, hb.y+dy/r*W); }
    var ht=v(0,0), D=Math.hypot(W,H); dx=P.x; dy=P.y; r=Math.hypot(dx,dy);
    if(r>D){ P=v(dx/r*D, dy/r*D); }
    return P;
  }
  function inicio(e){
    if(animando||e.target.closest('.ponto')) return;
    var p=local(e);
    var naDireita = p.x>W*0.62 && p.y>H*0.72 && atual<folhas.length-1;
    var naEsquerda = p.x<W*0.38 && p.y>H*0.72 && atual>0;
    if(!naDireita && !naEsquerda) return;
    arrasto={lado:naDireita?'d':'e', ini:p, t:performance.now(), f:folhas[naDireita?atual:atual-1]};
    if(e.cancelable) e.preventDefault();
    mover(e);
  }
  function mover(e){
    if(!arrasto) return; if(e.cancelable) e.preventDefault();
    var p=local(e), P = arrasto.lado==='d' ? v(p.x,p.y) : v(2*p.x-W, p.y);
    arrasto.f.P=limita(P); arrasto.ult=p; desenha(arrasto.f);
  }
  function solta(){
    if(!arrasto) return; var a=arrasto; arrasto=null;
    var p=a.ult||a.ini, rapido=(performance.now()-a.t)<350;
    if(a.lado==='d'){
      var foi = p.x<W*0.55 || (rapido && a.ini.x-p.x>30) || (performance.now()-a.t<250 && Math.hypot(p.x-a.ini.x,p.y-a.ini.y)<8);
      if(foi) animar(a.f,VIRADA(),600,H*0.1,function(){ irPara(atual+1); });
      else animar(a.f,lingua(performance.now(),false),350,0);
    } else {
      var volta = p.x>W*0.45 || (rapido && p.x-a.ini.x>30) || (performance.now()-a.t<250 && Math.hypot(p.x-a.ini.x,p.y-a.ini.y)<8);
      if(volta) animar(a.f,v(W,H),600,H*0.1,function(){ irPara(atual-1); });
      else animar(a.f,lingua(performance.now(),true),350,0);
    }
  }
  function medidas(){ var r=palco.getBoundingClientRect(); W=r.width; H=r.height; folhas.forEach(function(f){ f.versoIn.style.width=W+'px'; f.versoIn.style.height=H+'px'; f.sombra.style.width=W+'px'; f.sombra.style.height=H+'px'; }); irPara(atual); }
  function iniciarLivro(){
    document.getElementById('pontos').classList.add('mostra');
    [].slice.call(palco.querySelectorAll('.pagina')).forEach(function(pg){
      var el=document.createElement('div'); el.className='folha';
      pg.parentNode.insertBefore(el,pg); pg.classList.add('frente'); el.appendChild(pg);
      var sombra=document.createElement('div'); sombra.className='sombra'; el.appendChild(sombra);
      var verso=document.createElement('div'); verso.className='verso'; var vi=document.createElement('div'); vi.className='verso-in'; verso.appendChild(vi); el.appendChild(verso);
      folhas.push({el:el,frente:pg,verso:verso,versoIn:vi,sombra:sombra,P:v(0,0)});
    });
    medidas(); folhas.forEach(function(f){ f.P=v(W,H); desenha(f); });
    addEventListener('resize',medidas);
    palco.addEventListener('touchstart',inicio,{passive:false}); palco.addEventListener('touchmove',mover,{passive:false}); palco.addEventListener('touchend',solta); palco.addEventListener('touchcancel',solta);
    palco.addEventListener('mousedown',inicio); addEventListener('mousemove',mover); addEventListener('mouseup',solta);
    document.getElementById('ant').addEventListener('click',anterior);
    document.getElementById('prox').addEventListener('click',proxima);
    document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight') proxima(); if(e.key==='ArrowLeft') anterior(); });
    requestAnimationFrame(quadro);
  }
  var contFeita=false;
  function revelarContagem(){
    if(contFeita) return; contFeita=true;
    var pg=document.getElementById('pg-contagem');
    setTimeout(function(){ pg.querySelector('.contagem').classList.add('revelada'); estrelas(pg); },300);
  }

  /* ---------- estrelinhas na faixa azul ---------- */
  function estrelas(f){
    var c=f.querySelector('.estrelas'); if(!c||semMovimento) return;
    var x=c.getContext('2d'), W=c.width, H=c.height, lista=[], visivel=true, rodando=false;
    for(var i=0;i<46;i++) lista.push({x:Math.random()*W,y:Math.random()*H,r:3+Math.random()*7,f:.4+Math.random()*1.2,o:Math.random()*6.28,cruz:Math.random()<.35});
    function desenha(t){
      x.clearRect(0,0,W,H);
      lista.forEach(function(s){
        var a=Math.max(0,Math.sin(t/1000*s.f+s.o)); a=a*a;
        if(a<.02) return;
        x.globalAlpha=a*.9;
        var g=x.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*2.2); g.addColorStop(0,'rgba(255,255,255,.9)'); g.addColorStop(1,'rgba(201,217,232,0)');
        x.fillStyle=g; x.beginPath(); x.arc(s.x,s.y,s.r*2.2,0,6.283); x.fill();
        if(s.cruz){ x.strokeStyle='rgba(240,246,252,.95)'; x.lineWidth=1.4; x.beginPath();
          x.moveTo(s.x-s.r*2.6,s.y); x.lineTo(s.x+s.r*2.6,s.y); x.moveTo(s.x,s.y-s.r*2.6); x.lineTo(s.x,s.y+s.r*2.6); x.stroke(); }
      });
      x.globalAlpha=1;
      if(visivel) requestAnimationFrame(desenha); else rodando=false;
    }
    function liga(){ if(!rodando){ rodando=true; requestAnimationFrame(desenha); } }
        liga();
  }

  /* ---------- pétalas azuis caindo ---------- */
  function iniciarPetalas(){
    if(semMovimento) return;
    var c=document.getElementById('petalas'), x=c.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1), W, H, lista=[];
    function tam(){ W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
    tam(); addEventListener('resize',tam);
    var cores=[['#a9c4e4','#5f8ec6'],['#c8daef','#7aa2d2'],['#8fb0da','#3f6fa8'],['#dbe7f5','#9bb9e0']];
    function nova(topo){ var k=cores[Math.floor(Math.random()*cores.length)];
      return {x:Math.random()*W,y:topo?-30-Math.random()*H*.6:Math.random()*H,s:7+Math.random()*7,vy:22+Math.random()*22,amp:18+Math.random()*28,fr:.4+Math.random()*.7,
              fase:Math.random()*6.28,rot:Math.random()*6.28,vr:(Math.random()-.5)*1.4,flip:Math.random()*6.28,c1:k[0],c2:k[1],a:.55+Math.random()*.3}; }
    var N=W<600?11:15; for(var i=0;i<N;i++) lista.push(nova(true));
    var ant=null;
    function petala(p){
      var s=p.s, sx=Math.abs(Math.cos(p.flip))*.7+.3;
      x.save(); x.translate(p.x+Math.sin(p.fase)*p.amp,p.y); x.rotate(p.rot); x.scale(sx,1); x.globalAlpha=p.a;
      var g=x.createLinearGradient(0,-s,0,s); g.addColorStop(0,p.c1); g.addColorStop(1,p.c2); x.fillStyle=g;
      x.beginPath(); x.moveTo(0,-s); x.bezierCurveTo(s*.95,-s*.6,s*.8,s*.7,0,s); x.bezierCurveTo(-s*.8,s*.7,-s*.95,-s*.6,0,-s); x.fill();
      x.globalAlpha=p.a*.35; x.strokeStyle='#fff'; x.lineWidth=.8; x.beginPath(); x.moveTo(0,-s*.7); x.quadraticCurveTo(s*.12,0,0,s*.75); x.stroke();
      x.restore();
    }
    function quadro(t){
      if(ant===null) ant=t; var dt=Math.min(.05,(t-ant)/1000); ant=t;
      x.clearRect(0,0,W,H);
      if(!document.hidden) lista.forEach(function(p,i){
        p.y+=p.vy*dt; p.fase+=p.fr*dt; p.rot+=p.vr*dt; p.flip+=dt*1.2;
        if(p.y>H+30) lista[i]=nova(true);
        petala(p);
      });
      requestAnimationFrame(quadro);
    }
    requestAnimationFrame(quadro);
  }

  /* ---------- contagem regressiva ---------- */
  var rel=document.getElementById('relogio'), alvo=new Date(DATA_EVENTO).getTime(), dois=function(n){ return (n<10?'0':'')+n; };
  (function atualiza(){
    var r=alvo-Date.now();
    if(r<=0){ rel.style.display='none'; document.getElementById('chegou').style.display='block'; return; }
    var s=Math.floor(r/1000);
    document.getElementById('d').textContent=Math.floor(s/86400);
    document.getElementById('h').textContent=dois(Math.floor(s%86400/3600));
    document.getElementById('m').textContent=dois(Math.floor(s%3600/60));
    document.getElementById('s').textContent=dois(s%60);
    setTimeout(atualiza,1000);
  })();
})();
